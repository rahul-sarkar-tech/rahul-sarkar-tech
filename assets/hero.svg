<svg width="100%" height="auto" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="deep_space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#0A0C12" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Neon Crimson Radial Glows -->
    <radialGradient id="neon_glow_1" cx="20%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#FF1E56" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="neon_glow_core" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#990022" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cyberpunk Laser Border -->
    <linearGradient id="cyber_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3E3E" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#2D111A" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#FF2A55" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FF5757" stop-opacity="0.85" />
    </linearGradient>

    <!-- Chrome Metallic Text -->
    <linearGradient id="chrome_title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#FFA8B8" />
    </linearGradient>

    <!-- 3D Isometric Server Gradients -->
    <linearGradient id="iso_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E364A" />
      <stop offset="100%" stop-color="#181D29" />
    </linearGradient>
    <linearGradient id="iso_left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2333" />
      <stop offset="100%" stop-color="#0D1017" />
    </linearGradient>
    <linearGradient id="iso_right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="laser_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="matrix_grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
      <circle cx="28" cy="28" r="0.8" fill="#FF2A55" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="380" rx="20" fill="url(#deep_space)" />
  <rect width="1200" height="380" rx="20" fill="url(#matrix_grid)" />
  <rect width="1200" height="380" rx="20" fill="url(#neon_glow_1)" />
  <rect width="1200" height="380" rx="20" fill="url(#neon_glow_core)" />
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="url(#cyber_border)" stroke-width="1.5" />

  <!-- Corner Telemetry Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#FF2A55" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#FF2A55" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 24 336 L 24 356 L 44 356" fill="none" stroke="#FF2A55" stroke-width="2" stroke-opacity="0.8" />
  <path d="M 1176 336 L 1176 356 L 1156 356" fill="none" stroke="#FF2A55" stroke-width="2" stroke-opacity="0.8" />

  <!-- Animated Scanning Beam -->
  <line x1="20" y1="0" x2="1180" y2="0" stroke="#FF2A55" stroke-width="2" stroke-opacity="0.35">
    <animate attributeName="y1" values="20;360;20" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="20;360;20" dur="8s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.1;0.45;0.1" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- Top System Badge -->
  <g transform="translate(56, 46)">
    <circle cx="6" cy="6" r="4.5" fill="#38EF7D">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="6" cy="6" r="8" fill="none" stroke="#38EF7D" stroke-opacity="0.4">
      <animate attributeName="r" values="5;11;5" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="10" fill="#38EF7D" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="2">ROOTTHRIVE CORE // PRODUCTION TELEMETRY ACTIVE</text>
  </g>

  <!-- Left Main Content Area -->
  <g transform="translate(56, 136)">
    <text x="0" y="0" fill="url(#chrome_title)" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="1">RAHUL SARKAR</text>
    <text x="0" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">Founder @ RootThrive <tspan fill="#FF2A55">•</tspan> Systems Architect &amp; Performance Engineer</text>
    <text x="0" y="70" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400">Architecting high-throughput distributed backends, zero-blocking V8 runtimes, and revenue-scaling engines.</text>
  </g>

  <!-- Key Executive Metrics Matrix (Pills) -->
  <g transform="translate(56, 275)">
    <!-- Pill 1: Throughput -->
    <g transform="translate(0, 0)">
      <rect width="165" height="56" rx="10" fill="#121622" stroke="#FF2A55" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="16" y="24" fill="#FF5757" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">MAX THROUGHPUT</text>
      <text x="16" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="900">8,884 <tspan font-size="11" fill="#94A3B8" font-weight="500">req/s</tspan></text>
    </g>

    <!-- Pill 2: Latency -->
    <g transform="translate(180, 0)">
      <rect width="155" height="56" rx="10" fill="#121622" stroke="#FF2A55" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="16" y="24" fill="#38EF7D" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">AVG LATENCY</text>
      <text x="16" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="900">10.75 <tspan font-size="11" fill="#94A3B8" font-weight="500">ms</tspan></text>
    </g>

    <!-- Pill 3: P2P Socket Speed -->
    <g transform="translate(350, 0)">
      <rect width="165" height="56" rx="10" fill="#121622" stroke="#00B4D8" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="16" y="24" fill="#00B4D8" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">P2P WI-FI SPEED</text>
      <text x="16" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="900">45 MB/s<tspan font-size="11" fill="#94A3B8" font-weight="500">+</tspan></text>
    </g>

    <!-- Pill 4: Production Fleet -->
    <g transform="translate(530, 0)">
      <rect width="160" height="56" rx="10" fill="#121622" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="16" y="24" fill="#C084FC" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">ACTIVE FLEET</text>
      <text x="16" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="900">50+ <tspan font-size="11" fill="#94A3B8" font-weight="500">repos</tspan></text>
    </g>
  </g>

  <!-- Right Side: 3D Isometric Server & Cyber Core Cluster -->
  <g transform="translate(930, 70)">
    <!-- Glowing Aura -->
    <circle cx="110" cy="120" r="110" fill="#FF2A55" fill-opacity="0.12" filter="url(#laser_glow)" />

    <!-- Isometric Wireframe Orbit Ring -->
    <ellipse cx="110" cy="125" rx="130" ry="55" fill="none" stroke="#FF2A55" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 110 125" to="360 110 125" dur="20s" repeatCount="indefinite" />
    </ellipse>

    <!-- Server Blade 3 (Bottom) -->
    <g transform="translate(0, 90)">
      <!-- Top Face -->
      <polygon points="110,30 190,75 110,120 30,75" fill="url(#iso_top)" stroke="#384259" stroke-width="1" />
      <!-- Left Face -->
      <polygon points="30,75 110,120 110,145 30,100" fill="url(#iso_left)" stroke="#262D3D" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="110,120 190,75 190,100 110,145" fill="url(#iso_right)" stroke="#262D3D" stroke-width="1" />
      <!-- Glowing LEDs -->
      <circle cx="55" cy="98" r="2.5" fill="#38EF7D" />
      <circle cx="70" cy="107" r="2.5" fill="#38EF7D" />
      <circle cx="85" cy="116" r="2.5" fill="#FF2A55">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Server Blade 2 (Middle) -->
    <g transform="translate(0, 50)">
      <!-- Top Face -->
      <polygon points="110,30 190,75 110,120 30,75" fill="url(#iso_top)" stroke="#384259" stroke-width="1" />
      <!-- Left Face -->
      <polygon points="30,75 110,120 110,145 30,100" fill="url(#iso_left)" stroke="#262D3D" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="110,120 190,75 190,100 110,145" fill="url(#iso_right)" stroke="#262D3D" stroke-width="1" />
      <!-- Glowing LEDs -->
      <circle cx="55" cy="98" r="2.5" fill="#38EF7D" />
      <circle cx="70" cy="107" r="2.5" fill="#FF2A55">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="85" cy="116" r="2.5" fill="#38EF7D" />
    </g>

    <!-- Server Blade 1 (Top Core) -->
    <g transform="translate(0, 10)">
      <!-- Top Face -->
      <polygon points="110,30 190,75 110,120 30,75" fill="url(#iso_top)" stroke="#FF2A55" stroke-opacity="0.6" stroke-width="1.2" />
      <!-- Left Face -->
      <polygon points="30,75 110,120 110,145 30,100" fill="url(#iso_left)" stroke="#262D3D" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="110,120 190,75 190,100 110,145" fill="url(#iso_right)" stroke="#262D3D" stroke-width="1" />
      <!-- Glowing Crystal / CPU Core -->
      <polygon points="110,55 145,75 110,95 75,75" fill="#FF2A55" fill-opacity="0.4" stroke="#FF5757" stroke-width="1.5">
        <animate attributeName="fill-opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite" />
      </polygon>
      <!-- Core Telemetry Text -->
      <text x="110" y="80" fill="#FFFFFF" font-family="'SF Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">V8 CORE</text>
    </g>

    <!-- Floating Telemetry Badges -->
    <g transform="translate(130, -5)">
      <rect width="90" height="22" rx="4" fill="#131722" stroke="#FF2A55" stroke-opacity="0.6" stroke-width="1" />
      <text x="45" y="15" fill="#FF6B6B" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">100 SOCKETS</text>
    </g>
    <g transform="translate(-15, 185)">
      <rect width="95" height="22" rx="4" fill="#131722" stroke="#38EF7D" stroke-opacity="0.6" stroke-width="1" />
      <text x="47.5" y="15" fill="#38EF7D" font-family="'SF Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">0.0ms EVENT LAG</text>
    </g>
  </g>
</svg>
