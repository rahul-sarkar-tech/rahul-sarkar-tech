<svg width="100%" height="auto" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B" />
      <stop offset="45%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Glowing Cyber Accents -->
    <radialGradient id="cyber_glow_left" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#FF1E56" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyber_glow_right" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF3E3E" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8A001F" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Laser Border Gradient -->
    <linearGradient id="laser_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3E3E" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#4A1521" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FF2A55" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#2D111A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF3E3E" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="hud_card_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161924" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B0D14" stop-opacity="0.95" />
    </linearGradient>

    <!-- Metallic Gradient Text -->
    <linearGradient id="metallic_text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FF6B6B" />
    </linearGradient>

    <!-- Perspective Cyber Grid -->
    <pattern id="cyber_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
      <circle cx="32" cy="32" r="1" fill="#FF2A55" fill-opacity="0.18" />
    </pattern>

    <!-- Scanline Filter -->
    <linearGradient id="scanline_grad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#FF3E3E" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF3E3E" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF3E3E" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }
    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(360px); }
    }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="360" rx="18" fill="url(#hero_bg)" />
  <rect width="1200" height="360" rx="18" fill="url(#cyber_grid)" />
  <rect width="1200" height="360" rx="18" fill="url(#cyber_glow_left)" />
  <rect width="1200" height="360" rx="18" fill="url(#cyber_glow_right)" />
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="url(#laser_border)" stroke-width="1.5" />

  <!-- Animated Laser Scanline -->
  <rect x="0" y="0" width="1200" height="40" fill="url(#scanline_grad)">
    <animate attributeName="y" values="-40;360" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Top Status Beacon -->
  <g transform="translate(52, 44)">
    <circle cx="6" cy="6" r="4.5" fill="#FF2A55">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="6" cy="6" r="9" fill="none" stroke="#FF2A55" stroke-opacity="0.5">
      <animate attributeName="r" values="5;12;5" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="10" fill="#FF6B6B" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="2.5">SYSTEM STATUS // PRODUCTION READY • ROOTTHRIVE CORE</text>
  </g>

  <!-- Main Hero Brand Identity -->
  <g transform="translate(52, 126)">
    <text x="0" y="0" fill="url(#metallic_text)" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1.5">RAHUL SARKAR</text>
    <text x="0" y="34" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5">Founder @ RootThrive • Systems Architect &amp; Performance Engineer</text>
    <text x="0" y="66" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400">Transforming offline businesses into high-speed digital engines with scalable Web, Mobile &amp; API platforms.</text>
  </g>

  <!-- Tech Capsule Pills -->
  <g transform="translate(52, 280)">
    <rect x="0" y="0" width="90" height="28" rx="7" fill="#151922" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1" />
    <text x="45" y="18" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">NESTJS</text>

    <rect x="100" y="0" width="92" height="28" rx="7" fill="#151922" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1" />
    <text x="146" y="18" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">NEXT.JS</text>

    <rect x="202" y="0" width="90" height="28" rx="7" fill="#151922" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1" />
    <text x="247" y="18" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">FLUTTER</text>

    <rect x="302" y="0" width="112" height="28" rx="7" fill="#151922" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1" />
    <text x="358" y="18" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">POSTGRESQL</text>

    <rect x="424" y="0" width="124" height="28" rx="7" fill="#151922" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1" />
    <text x="486" y="18" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">WHATSAPP CRM</text>

    <rect x="558" y="0" width="118" height="28" rx="7" fill="#151922" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1" />
    <text x="617" y="18" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">P2P PROTOCOL</text>
  </g>

  <!-- Right Side HUD Telemetry Grid -->
  <g transform="translate(775, 42)">
    <!-- Box 1: Peak Req/Sec -->
    <g transform="translate(0, 0)">
      <rect width="180" height="120" rx="12" fill="url(#hud_card_bg)" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1.2" />
      <text x="18" y="30" fill="#FF6B6B" font-family="'SF Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1">MAX THROUGHPUT</text>
      <text x="18" y="72" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">8,884</text>
      <text x="18" y="96" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">req / sec @ 10.75ms avg</text>
    </g>

    <!-- Box 2: Production Fleet -->
    <g transform="translate(195, 0)">
      <rect width="180" height="120" rx="12" fill="url(#hud_card_bg)" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1.2" />
      <text x="18" y="30" fill="#FF6B6B" font-family="'SF Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1">DEPLOYED FLEET</text>
      <text x="18" y="72" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">50+</text>
      <text x="18" y="96" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">production &amp; OSS repos</text>
    </g>

    <!-- Box 3: RootDrop Wi-Fi Transfer -->
    <g transform="translate(0, 135)">
      <rect width="180" height="120" rx="12" fill="url(#hud_card_bg)" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1.2" />
      <text x="18" y="30" fill="#FF6B6B" font-family="'SF Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1">P2P PROTOCOL</text>
      <text x="18" y="72" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">45 MB/s+</text>
      <text x="18" y="96" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">RootDrop Wi-Fi socket pipe</text>
    </g>

    <!-- Box 4: Event Loop Efficiency -->
    <g transform="translate(195, 135)">
      <rect width="180" height="120" rx="12" fill="url(#hud_card_bg)" stroke="#FF2A55" stroke-opacity="0.35" stroke-width="1.2" />
      <text x="18" y="30" fill="#FF6B6B" font-family="'SF Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1">EVENT LOOP LAG</text>
      <text x="18" y="72" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900">0.0 ms</text>
      <text x="18" y="96" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">zero main-thread blocking</text>
    </g>
  </g>
</svg>
