<svg width="100%" height="auto" viewBox="0 0 580 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rd_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101926" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>
    <linearGradient id="rd_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#02569B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="580" height="230" rx="14" fill="url(#rd_bg)" />
  <rect x="0.75" y="0.75" width="578.5" height="228.5" rx="13.25" fill="none" stroke="url(#rd_border)" stroke-width="1.5" />

  <!-- Left: Content Area -->
  <g transform="translate(24, 22)">
    <!-- Pill Tag -->
    <rect width="180" height="22" rx="4" fill="#0C2436" stroke="#00B4D8" stroke-opacity="0.5" stroke-width="1" />
    <text x="8" y="15" fill="#00B4D8" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">📦 45 MB/s+ • P2P ENGINE</text>

    <!-- Title -->
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="900">RootDrop P2P</text>
    <text x="0" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Cross-Platform File Sharing Protocol</text>

    <!-- Description -->
    <text x="0" y="100" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">High-speed local transfer hitting 45MB/s+ over Wi-Fi.</text>
    <text x="0" y="118" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Dynamic socket chunking, local discovery, zero cloud.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="60" height="20" rx="4" fill="#142436" />
      <text x="30" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Flutter</text>

      <rect x="66" y="0" width="50" height="20" rx="4" fill="#142436" />
      <text x="91" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Dart</text>

      <rect x="122" y="0" width="94" height="20" rx="4" fill="#142436" />
      <text x="169" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">TCP Sockets</text>

      <rect x="222" y="0" width="92" height="20" rx="4" fill="#142436" />
      <text x="268" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">P2P mDNS</text>
    </g>

    <!-- CTA -->
    <text x="0" y="186" fill="#00B4D8" font-family="'SF Mono', monospace" font-size="11" font-weight="700">EXPLORE P2P REPO &amp; WEB PORTAL →</text>
  </g>

  <!-- Right: Miniature Transfer UI Widget -->
  <g transform="translate(380, 24)">
    <rect width="176" height="182" rx="10" fill="#08101C" stroke="#16283D" stroke-width="1.2" />

    <!-- Widget Header -->
    <rect width="176" height="28" rx="10" fill="#111F33" />
    <rect y="18" width="176" height="10" fill="#111F33" />
    <circle cx="16" cy="14" r="5" fill="#00B4D8" />
    <text x="28" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">P2P Direct Conduit</text>

    <!-- Device Connection Row -->
    <g transform="translate(10, 38)">
      <rect width="66" height="28" rx="4" fill="#16283D" />
      <text x="33" y="18" fill="#FFFFFF" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">macOS</text>

      <!-- Connecting beam -->
      <line x1="68" y1="14" x2="88" y2="14" stroke="#00B4D8" stroke-width="2" stroke-dasharray="3 3" />

      <rect x="90" width="66" height="28" rx="4" fill="#16283D" />
      <text x="123" y="18" fill="#FFFFFF" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">Android</text>
    </g>

    <!-- Transfer Speed Meter -->
    <g transform="translate(10, 78)">
      <rect width="156" height="46" rx="6" fill="#0F2436" />
      <text x="10" y="16" fill="#00B4D8" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700">TRANSFER THROUGHPUT</text>
      <text x="10" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="900">45.8 <tspan font-size="10" fill="#94A3B8" font-weight="600">MB/s Wi-Fi</tspan></text>
    </g>

    <!-- Transfer Progress Bar -->
    <g transform="translate(10, 134)">
      <text x="0" y="10" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">4.2 GB 4K Stream • 88%</text>
      <rect y="16" width="156" height="14" rx="4" fill="#16283D" />
      <rect y="16" width="138" height="14" rx="4" fill="#00B4D8" />
    </g>
  </g>
</svg>
