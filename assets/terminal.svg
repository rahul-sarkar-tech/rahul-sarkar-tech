<svg width="100%" height="auto" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="term_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="term_border_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E2333" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF2A55" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="ascii_fire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5757" />
      <stop offset="50%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>
  </defs>

  <!-- Terminal Chassis -->
  <rect width="1200" height="340" rx="16" fill="url(#term_bg_grad)" />
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" fill="none" stroke="url(#term_border_grad)" stroke-width="1.5" />

  <!-- Terminal Header / Titlebar -->
  <rect width="1200" height="40" rx="16" fill="#111520" />
  <rect y="24" width="1200" height="16" fill="#111520" />
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#1D2333" stroke-width="1" />

  <!-- Traffic Light Window Buttons -->
  <circle cx="26" cy="20" r="6" fill="#FF5F56" />
  <circle cx="46" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="66" cy="20" r="6" fill="#27C93F" />

  <!-- Active Tab -->
  <g transform="translate(100, 7)">
    <rect width="210" height="26" rx="6" fill="#1A202E" />
    <circle cx="16" cy="13" r="3.5" fill="#38EF7D" />
    <text x="28" y="17" fill="#E2E8F0" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="600">sarkar@rootthrive: ~</text>
  </g>

  <!-- Left Column: ASCII Monogram Logo -->
  <g transform="translate(48, 76)">
    <text font-family="'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="900" fill="url(#ascii_fire)" xml:space="preserve">
      <tspan x="0" y="20"> ██████╗  ███████╗  ██████╗  ████████╗ </tspan>
      <tspan x="0" y="38"> ██╔══██╗ ╚══███╔╝  ██╔══██╗ ╚══██╔══╝ </tspan>
      <tspan x="0" y="56"> ██████╔╝   ███╔╝   ██████╔╝    ██║    </tspan>
      <tspan x="0" y="74"> ██╔══██╗  ███╔╝    ██╔══██╗    ██║    </tspan>
      <tspan x="0" y="92"> ██║  ██║ ███████╗  ██║  ██║    ██║    </tspan>
      <tspan x="0" y="110"> ╚═╝  ╚═╝ ╚══════╝  ╚═╝  ╚═╝    ╚═╝    </tspan>
      <tspan x="0" y="142" fill="#64748B" font-size="11"> ROOTTHRIVE SYSTEMS // SARKAR-OS </tspan>
      <tspan x="0" y="162" fill="#FF2A55" font-size="10"> ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■ </tspan>
    </text>
  </g>

  <!-- Subtle Column Divider -->
  <line x1="390" y1="58" x2="390" y2="315" stroke="#1D2333" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- Right Column: Neofetch System Information -->
  <g transform="translate(420, 72)">
    <text font-family="'SF Mono', 'Fira Code', monospace" font-size="13.5" xml:space="preserve">
      <tspan x="0" y="20" fill="#FF2A55" font-weight="700">sarkar@rootthrive</tspan><tspan fill="#64748B"> ~ </tspan><tspan fill="#F8FAFC" font-weight="600">neofetch --telemetry</tspan>
      
      <tspan x="0" y="48" fill="#FF5757" font-weight="700">Founder       :</tspan><tspan fill="#FFFFFF" font-weight="500">  Rahul Sarkar</tspan>
      <tspan x="0" y="72" fill="#FF5757" font-weight="700">Company       :</tspan><tspan fill="#FFFFFF" font-weight="500">  RootThrive (rootthrive.in)</tspan>
      <tspan x="0" y="96" fill="#FF5757" font-weight="700">Core Runtimes :</tspan><tspan fill="#FFFFFF" font-weight="500">  NestJS (Node.js) • Next.js 16 • Flutter • Dart</tspan>
      <tspan x="0" y="120" fill="#FF5757" font-weight="700">Database Pool :</tspan><tspan fill="#FFFFFF" font-weight="500">  PostgreSQL (100-Socket Pool) • TypeORM • Supabase</tspan>
      <tspan x="0" y="144" fill="#FF5757" font-weight="700">Throughput    :</tspan><tspan fill="#38EF7D" font-weight="800">  8,884 Req/Sec </tspan><tspan fill="#94A3B8">(Avg: 10.75ms • Zero Main-Thread Lag)</tspan>
      <tspan x="0" y="168" fill="#FF5757" font-weight="700">P2P Network   :</tspan><tspan fill="#00B4D8" font-weight="800">  45 MB/s+ </tspan><tspan fill="#94A3B8">(Dynamic Chunked TCP Sockets over Wi-Fi)</tspan>
      <tspan x="0" y="192" fill="#FF5757" font-weight="700">Production    :</tspan><tspan fill="#C084FC" font-weight="800">  50+ </tspan><tspan fill="#FFFFFF" font-weight="500">Active Repositories Across Web, Mobile &amp; APIs</tspan>

      <tspan x="0" y="228" fill="#FF2A55" font-weight="700">sarkar@rootthrive</tspan><tspan fill="#64748B"> ~ </tspan><tspan fill="#F8FAFC" font-weight="600">scale --fleet=all --status=live</tspan>
    </text>

    <!-- Animated Blinking Cursor -->
    <rect x="325" y="284" width="8" height="15" fill="#FF2A55">
      <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
