<svg width="100%" height="auto" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arch_chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="arch_stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#1E2333" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF2A55" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="core_node_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24101A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10080E" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="outer_node_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121622" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090B10" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- Main Chassis -->
  <rect width="1200" height="250" rx="16" fill="url(#arch_chassis)" />
  <rect x="0.75" y="0.75" width="1198.5" height="248.5" rx="15.25" fill="none" stroke="url(#arch_stroke)" stroke-width="1.5" />

  <!-- Background Data Bus Conduits -->
  <line x1="365" y1="125" x2="435" y2="125" stroke="#FF2A55" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="765" y1="125" x2="835" y2="125" stroke="#FF2A55" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Animated Flying Electrons / Packets -->
  <circle cx="365" cy="125" r="4.5" fill="#FF5757">
    <animate attributeName="cx" values="365;435" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="765" cy="125" r="4.5" fill="#38EF7D">
    <animate attributeName="cx" values="765;835" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Node 01: Ingestion & Growth Funnel -->
  <g transform="translate(35, 25)">
    <rect width="330" height="200" rx="12" fill="url(#outer_node_bg)" stroke="#222A3B" stroke-width="1.2" />
    <!-- Header Pill -->
    <rect x="18" y="16" width="165" height="22" rx="4" fill="#1C2433" />
    <text x="26" y="31" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">01 // INGESTION &amp; CRM</text>
    
    <text x="18" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16.5" font-weight="800">Business &amp; Omnichannel</text>
    <text x="18" y="94" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5">• Offline Retail Logistics &amp; Orders</text>
    <text x="18" y="116" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5">• WhatsApp Cloud API Webhooks</text>
    <text x="18" y="138" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5">• Hyperlocal Cart &amp; Dispatch Intake</text>
    
    <rect x="18" y="160" width="294" height="24" rx="4" fill="#151A26" />
    <text x="165" y="176" fill="#FF6B6B" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">REALTIME WEBHOOK EVENT PIPELINE</text>
  </g>

  <!-- Node 02: RootThrive High-Concurrency Core (Center Highlight) -->
  <g transform="translate(435, 15)">
    <rect width="330" height="220" rx="14" fill="url(#core_node_bg)" stroke="#FF2A55" stroke-width="1.8" />
    <!-- Header Pill -->
    <rect x="18" y="18" width="180" height="24" rx="4" fill="#3D121F" />
    <text x="26" y="34" fill="#FF5757" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">02 // ROOTTHRIVE CORE</text>
    
    <text x="18" y="74" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17.5" font-weight="900">High-Concurrency Engine</text>
    <text x="18" y="104" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">• <tspan font-weight="800" fill="#38EF7D">8,884 Req/Sec</tspan> NestJS Scalable API</text>
    <text x="18" y="128" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">• Zero Main-Thread Event-Loop Lag</text>
    <text x="18" y="152" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">• <tspan font-weight="800" fill="#38EF7D">100-Socket</tspan> PostgreSQL Connection Pool</text>
    
    <rect x="18" y="176" width="294" height="26" rx="5" fill="#38101A" stroke="#FF2A55" stroke-opacity="0.4" stroke-width="1" />
    <text x="165" y="193" fill="#FF5757" font-family="'SF Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">LATENCY: 10.75ms PEAK EFFICIENCY</text>
  </g>

  <!-- Node 03: Distributed Edge & Native Clients -->
  <g transform="translate(835, 25)">
    <rect width="330" height="200" rx="12" fill="url(#outer_node_bg)" stroke="#222A3B" stroke-width="1.2" />
    <!-- Header Pill -->
    <rect x="18" y="16" width="165" height="22" rx="4" fill="#1C2433" />
    <text x="26" y="31" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">03 // EDGE &amp; SOCKETS</text>
    
    <text x="18" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16.5" font-weight="800">Native Client Interfaces</text>
    <text x="18" y="94" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5">• Flutter iOS &amp; Android Apps (Riverpod)</text>
    <text x="18" y="116" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5">• RootDrop P2P Sockets (<tspan font-weight="800" fill="#00B4D8">45 MB/s+</tspan>)</text>
    <text x="18" y="138" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5">• Realtime GPS Dispatch &amp; Live Tracking</text>
    
    <rect x="18" y="160" width="294" height="24" rx="4" fill="#151A26" />
    <text x="165" y="176" fill="#38EF7D" font-family="'SF Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">CLIENTS: ZERO-LATENCY UX</text>
  </g>
</svg>
