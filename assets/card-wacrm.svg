<svg width="100%" height="auto" viewBox="0 0 580 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card_bg_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>
    <linearGradient id="card_border_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1A202C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#25D366" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="580" height="210" rx="12" fill="url(#card_bg_1)" />
  <rect x="0.75" y="0.75" width="578.5" height="208.5" rx="11.25" fill="none" stroke="url(#card_border_1)" stroke-width="1.5" />

  <!-- Category Tag -->
  <rect x="24" y="20" width="165" height="22" rx="4" fill="#0E291B" stroke="#25D366" stroke-opacity="0.4" stroke-width="1" />
  <text x="32" y="35" fill="#25D366" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" font-weight="700" letter-spacing="1">💬 OPEN SOURCE • CRM</text>

  <!-- Title & Headline -->
  <text x="24" y="70" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">WACRM</text>
  <text x="110" y="70" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">WhatsApp Business Automation Platform</text>

  <!-- Summary Description -->
  <text x="24" y="98" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Self-hostable CRM template with shared multi-agent inbox, sales conversion</text>
  <text x="24" y="118" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">pipelines, broadcast campaigns, and automated trigger webhook flows.</text>

  <!-- Tech Stack Badges -->
  <g transform="translate(24, 142)">
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#1A202C" />
    <text x="42.5" y="15" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="92" y="0" width="82" height="22" rx="4" fill="#1A202C" />
    <text x="133" y="15" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Next.js 16</text>

    <rect x="181" y="0" width="82" height="22" rx="4" fill="#1A202C" />
    <text x="222" y="15" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">TailwindCSS</text>

    <rect x="270" y="0" width="112" height="22" rx="4" fill="#1A202C" />
    <text x="326" y="15" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">WhatsApp API</text>
  </g>

  <!-- Bottom CTA -->
  <text x="24" y="190" fill="#25D366" font-family="'SF Mono', monospace" font-size="11" font-weight="700">EXPLORE SOURCE CODE &amp; ARCHITECTURE →</text>
