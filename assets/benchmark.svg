<svg width="100%" height="auto" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bench_chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="glow_bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="60%" stop-color="#FF5757" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>
  </defs>

  <rect width="1200" height="190" rx="16" fill="url(#bench_chassis)" />
  <rect x="0.75" y="0.75" width="1198.5" height="188.5" rx="15.25" fill="none" stroke="#262D3D" stroke-width="1.5" />

  <!-- Title Line -->
  <text x="40" y="34" fill="#FF5757" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">⚡ HTTP CONCURRENCY BENCHMARK // PEAK LOAD TESTING &amp; RUNTIME LATENCY</text>

  <!-- Baseline Bar -->
  <g transform="translate(40, 56)">
    <text x="0" y="16" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Standard Node.js / Synchronous stdout</text>
    <rect x="300" y="2" width="50" height="20" rx="4" fill="#222A3B" />
    <text x="360" y="17" fill="#64748B" font-family="'SF Mono', monospace" font-size="11.5" font-weight="600">142 req/s (Baseline)</text>
  </g>

  <!-- RootThrive High-Concurrency Bar -->
  <g transform="translate(40, 98)">
    <text x="0" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">RootThrive Tuned Engine (PgPool + V8)</text>
    <rect x="300" y="2" width="620" height="26" rx="6" fill="url(#glow_bar)">
      <animate attributeName="opacity" values="0.88;1;0.88" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="930" y="21" fill="#FFFFFF" font-family="'SF Mono', monospace" font-size="14" font-weight="900">8,884 req/s</text>
  </g>

  <!-- Telemetry Metrics Badges -->
  <g transform="translate(340, 146)">
    <rect x="0" y="0" width="175" height="26" rx="6" fill="#33101A" stroke="#FF2A55" stroke-opacity="0.5" stroke-width="1" />
    <text x="87.5" y="17" fill="#FF5757" font-family="'SF Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">▲ +6,100% THROUGHPUT</text>

    <rect x="190" y="0" width="165" height="26" rx="6" fill="#11241B" stroke="#38EF7D" stroke-opacity="0.5" stroke-width="1" />
    <text x="272.5" y="17" fill="#38EF7D" font-family="'SF Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">⚡ 10.75ms LATENCY</text>

    <rect x="370" y="0" width="175" height="26" rx="6" fill="#131B2B" stroke="#00B4D8" stroke-opacity="0.5" stroke-width="1" />
    <text x="457.5" y="17" fill="#00B4D8" font-family="'SF Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">🔒 0.0ms V8 EVENT LAG</text>
  </g>
</svg>
