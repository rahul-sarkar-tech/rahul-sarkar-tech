<svg width="100%" height="auto" viewBox="0 0 580 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lms_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A111A" />
      <stop offset="100%" stop-color="#0A070E" />
    </linearGradient>
    <linearGradient id="lms_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2D111A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF2A55" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="580" height="230" rx="14" fill="url(#lms_bg)" />
  <rect x="0.75" y="0.75" width="578.5" height="228.5" rx="13.25" fill="none" stroke="url(#lms_border)" stroke-width="1.5" />

  <!-- Left: Content Area -->
  <g transform="translate(24, 22)">
    <!-- Pill Tag -->
    <rect width="180" height="22" rx="4" fill="#360E18" stroke="#FF2A55" stroke-opacity="0.5" stroke-width="1" />
    <text x="8" y="15" fill="#FF5757" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">⚡ 8.8k REQ/S • LMS CORE</text>

    <!-- Title -->
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="900">RootThrive LMS</text>
    <text x="0" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Enterprise High-Concurrency E-Learning</text>

    <!-- Description -->
    <text x="0" y="100" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">High-throughput NestJS engine scaling to 8,884 req/s.</text>
    <text x="0" y="118" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Domain-Driven Design + modern Flutter client.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="62" height="20" rx="4" fill="#24151D" />
      <text x="31" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">NestJS</text>

      <rect x="68" y="0" width="80" height="20" rx="4" fill="#24151D" />
      <text x="108" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">PostgreSQL</text>

      <rect x="154" y="0" width="60" height="20" rx="4" fill="#24151D" />
      <text x="184" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Flutter</text>

      <rect x="220" y="0" width="70" height="20" rx="4" fill="#24151D" />
      <text x="255" y="14" fill="#E2E8F0" font-family="'SF Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">Riverpod</text>
    </g>

    <!-- CTA -->
    <text x="0" y="186" fill="#FF5757" font-family="'SF Mono', monospace" font-size="11" font-weight="700">INSPECT BACKEND CORE &amp; FLUTTER CLIENT →</text>
  </g>

  <!-- Right: Miniature Telemetry & Benchmark Widget -->
  <g transform="translate(380, 24)">
    <rect width="176" height="182" rx="10" fill="#0C0812" stroke="#2D1524" stroke-width="1.2" />

    <!-- Widget Header -->
    <rect width="176" height="28" rx="10" fill="#1C101D" />
    <rect y="18" width="176" height="10" fill="#1C101D" />
    <circle cx="16" cy="14" r="5" fill="#FF2A55" />
    <text x="28" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Engine Telemetry</text>

    <!-- Metric 1: Peak Throughput -->
    <g transform="translate(10, 36)">
      <rect width="156" height="42" rx="6" fill="#260D18" />
      <text x="10" y="16" fill="#FF6B6B" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700">PEAK CONCURRENCY</text>
      <text x="10" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="900">8,884 <tspan font-size="9" fill="#94A3B8" font-weight="600">req / sec</tspan></text>
    </g>

    <!-- Metric 2: Average Latency -->
    <g transform="translate(10, 84)">
      <rect width="156" height="42" rx="6" fill="#13241B" />
      <text x="10" y="16" fill="#38EF7D" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700">AVERAGE LATENCY</text>
      <text x="10" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="900">10.75 <tspan font-size="9" fill="#94A3B8" font-weight="600">ms response</tspan></text>
    </g>

    <!-- Mini Connection Pool Status -->
    <g transform="translate(10, 134)">
      <rect width="156" height="36" rx="6" fill="#171224" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
      <text x="10" y="15" fill="#C084FC" font-family="'SF Mono', monospace" font-size="8.5" font-weight="700">POSTGRES POOL</text>
      <text x="10" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">100 Sockets Allocated</text>
    </g>
  </g>
</svg>
